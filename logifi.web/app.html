<!DOCTYPE html>
<html lang="en">
  <head>
    {{ HEAD }}
    <style>
      html,
      body {
        margin: 0;
        background: #030712;
        color: #e5e7eb;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #030712;
        color: #e5e7eb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      #app-splash img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }

      #app-splash-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(229, 231, 235, 0.2);
        border-top-color: #34d399;
        border-radius: 50%;
        animation: app-splash-spin 0.8s linear infinite;
      }

      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-live="polite" aria-busy="true">
      <img src="/images/app-logo-mark.png" alt="Logifi" width="72" height="72" />
      <div id="app-splash-spinner" aria-hidden="true"></div>
      <p style="margin: 0; font-size: 0.95rem; opacity: 0.85;">Loading Logifi…</p>
    </div>
    {{ APP }}
  </body>
</html>
