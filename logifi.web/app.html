<!DOCTYPE html>
<html{{ HTML_ATTRS }}>
  <head>
    {{ HEAD }}
    <style>
      html,
      body {
        margin: 0;
        background: #030712;
        color: #e5e7eb;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #030712;
        color: #e5e7eb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      #app-splash img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        object-fit: cover;
        animation: app-splash-mark-pulse 2.4s ease-in-out infinite;
      }

      @keyframes app-splash-mark-pulse {
        0%,
        100% {
          opacity: 0.72;
        }
        50% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash img {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-busy="true" aria-label="Loading logbook">
      <img src="/images/app-logo-mark.png" alt="" width="72" height="72" decoding="async" />
    </div>
    {{ APP }}
  </body>
</html>
