<style>

      body {
        margin: 0;
        background: #030712;
        color: #e5e7eb;
      }

      script,
      #__NUXT_DATA__,
      [type='application/json'] {
        display: none !important;
        position: absolute !important;
        width: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
      }

      /* Mirrors app/assets/css/loading-animation.css for the pre-Vue splash. */
      .loading-animation {
        --loading-center-x: 256px;
        --loading-center-y: 256px;
        --loading-merge-bl-x: 127px;
        --loading-merge-bl-y: -146.25px;
        --loading-merge-tr-x: -128.5px;
        --loading-merge-tr-y: 145px;
        --loading-origin-bl-x: 39px;
        --loading-origin-bl-y: 112px;
      --loading-origin-tr-x: 111px;
      --loading-origin-tr-y: 10px;
      --loading-wordmark-bl-x: 165.43px;
      --loading-wordmark-bl-y: 148.89px;
      --loading-wordmark-tr-x: -206.62px;
      --loading-wordmark-tr-y: 80.28px;
      --loading-wordmark-bl-sx: 1.071;

      --loading-wordmark-tr-sx: 1.0318;
      --loading-wordmark-tr-sy: 0.8693;
        display: flex;
        align-items: center;
        justify-content: center;

      .loading-animation--fullscreen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #030712;
      }
      .loading-animation__mark {
        display: block;
        flex-shrink: 0;
        overflow: visible;
      }
      .loading-animation__mark--md {
        width: 72px;
        height: auto;
      }
      .loading-animation__stage {
        transform-box: view-box;
        transform-origin: var(--loading-center-x) var(--loading-center-y);
      }
      .loading-animation__motion--bl {
        transform-box: fill-box;
        transform-origin: var(--loading-origin-bl-x) var(--loading-origin-bl-y);
      }
      .loading-animation__motion--tr {

        transform-origin: var(--loading-origin-tr-x) var(--loading-origin-tr-y);

        animation: loading-animation-corner-bl 2.8s ease-in-out infinite;

      .loading-animation--variant-propeller.loading-animation--motion .loading-animation__motion--tr {
        animation: loading-animation-corner-tr 2.8s ease-in-out infinite;
      }
      .loading-animation--variant-propeller.loading-animation--motion .loading-animation__stage {

        }
        88% {
          transform: translate(0, 0);
        }
      }

        0%,
        6%,
        94%,
        100% {
          transform: translate(0, 0);
        }
        30%,
        40%,
        75% {
          transform: translate(var(--loading-merge-tr-x), var(--loading-merge-tr-y));
        }
        88% {
          transform: translate(0, 0);
        }
      }
      @keyframes loading-animation-stage-spin {
        0%,
        40% {

        }
        75% {

        }
        100% {
          transform: rotate(720deg);
        }

    <script>
      /* The wordmark SVG is a flex sibling of the propeller. WKWebView still paints it beside the mark when display:none loses. Leave it in the template unless this is the marketing shell. */
      (function () {
        if (!document.documentElement.classList.contains('boot-wordmark')) return
        var splash = document.getElementById('app-splash')
        var held = document.getElementById('boot-splash-wordmark')
        if (!splash || !held || !held.content) return
        splash.appendChild(held.content.cloneNode(true))
      })()
    </script>
    <script>
      /* hide-nuxt-payload: keep __NUXT_DATA__ for Nuxt, but give WKWebView nothing to paint. */
      (function () {
        function hidePayload() {
          var payload = document.getElementById('__NUXT_DATA__')
          if (payload) {
            payload.hidden = true
            payload.style.setProperty('display', 'none', 'important')
            payload.style.setProperty('position', 'absolute', 'important')
            payload.style.setProperty('width', '0', 'important')
            payload.style.setProperty('height', '0', 'important')
            payload.style.setProperty('overflow', 'hidden', 'important')
            var parent = payload.parentNode
            if (parent && parent.id !== 'nuxt-payload-hide') {
              var wrap = document.createElement('div')
              wrap.id = 'nuxt-payload-hide'
              wrap.hidden = true
              wrap.style.setProperty('display', 'none', 'important')
              parent.insertBefore(wrap, payload)
              wrap.appendChild(payload)
            }
          }
          var roots = [document.body, document.documentElement]
          for (var r = 0; r < roots.length; r++) {
            var root = roots[r]
            if (!root) continue
            var kids = root.childNodes
            for (var i = kids.length - 1; i >= 0; i--) {
              var node = kids[i]
              if (node.nodeType !== 3) continue
              var text = node.textContent || ''
              if (text.indexOf('serverRendered') === -1) continue
              root.removeChild(node)
            }
          }
        }
        hidePayload()
        document.addEventListener('DOMContentLoaded', hidePayload)
      })()
    </script>
