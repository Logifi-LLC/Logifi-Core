<!DOCTYPE html>
<html{{ HTML_ATTRS }}>
  <head>
    {{ HEAD }}
    <style>
      html,
      body {
        margin: 0;
        background: #030712;
        color: #e5e7eb;
      }

      /* Mirrors app/assets/css/loading-animation.css for pre-Vue boot */
      .loading-animation {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loading-animation--fullscreen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #030712;
      }
      .loading-animation__mark--md {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        object-fit: cover;
        animation: loading-animation-mark-pulse 2.4s ease-in-out infinite;
      }
      @keyframes loading-animation-mark-pulse {
        0%,
        100% {
          opacity: 0.72;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-animation__mark--md {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="app-splash"
      class="loading-animation loading-animation--fullscreen"
      role="status"
      aria-busy="true"
      aria-label="Loading logbook"
    >
      <img
        src="/images/app-logo-mark.png"
        alt=""
        class="loading-animation__mark loading-animation__mark--md"
        width="72"
        height="72"
        decoding="async"
      />
    </div>
    {{ APP }}
  </body>
</html>
