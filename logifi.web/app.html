<!DOCTYPE html>
<html{{ HTML_ATTRS }}>
  <head>
    {{ HEAD }}
    <style>
      html,
      body {
        margin: 0;
        background: #030712;
        color: #e5e7eb;
      }

      /* Mirrors app/assets/css/loading-animation.css (propeller boot only) */
      .loading-animation {
        --loading-center-x: 256px;
        --loading-center-y: 256px;
        --loading-merge-bl-x: 127px;
        --loading-merge-bl-y: -146.25px;
        --loading-merge-tr-x: -128.5px;
        --loading-merge-tr-y: 145px;
        --loading-origin-bl-x: 39px;
        --loading-origin-bl-y: 112px;
        --loading-origin-tr-x: 111px;
        --loading-origin-tr-y: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loading-animation--fullscreen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #030712;
      }
      .loading-animation__mark {
        display: block;
        flex-shrink: 0;
        overflow: visible;
      }
      .loading-animation__mark--md {
        width: 72px;
        height: auto;
      }
      .loading-animation__stage {
        transform-box: view-box;
        transform-origin: var(--loading-center-x) var(--loading-center-y);
      }
      .loading-animation__motion--bl {
        transform-box: fill-box;
        transform-origin: var(--loading-origin-bl-x) var(--loading-origin-bl-y);
      }
      .loading-animation__motion--tr {
        transform-box: fill-box;
        transform-origin: var(--loading-origin-tr-x) var(--loading-origin-tr-y);
      }
      .loading-animation--variant-propeller.loading-animation--motion .loading-animation__motion--bl {
        animation: loading-animation-corner-bl 2.8s ease-in-out infinite;
      }
      .loading-animation--variant-propeller.loading-animation--motion .loading-animation__motion--tr {
        animation: loading-animation-corner-tr 2.8s ease-in-out infinite;
      }
      .loading-animation--variant-propeller.loading-animation--motion .loading-animation__stage {
        animation: loading-animation-stage-spin 2.8s cubic-bezier(0.55, 0.12, 0.85, 0.38) infinite;
      }
      @keyframes loading-animation-corner-bl {
        0%,
        6%,
        94%,
        100% {
          transform: translate(0, 0);
        }
        30%,
        40%,
        75% {
          transform: translate(var(--loading-merge-bl-x), var(--loading-merge-bl-y));
        }
        88% {
          transform: translate(0, 0);
        }
      }
      @keyframes loading-animation-corner-tr {
        0%,
        6%,
        94%,
        100% {
          transform: translate(0, 0);
        }
        30%,
        40%,
        75% {
          transform: translate(var(--loading-merge-tr-x), var(--loading-merge-tr-y));
        }
        88% {
          transform: translate(0, 0);
        }
      }
      @keyframes loading-animation-stage-spin {
        0%,
        40% {
          transform: rotate(0deg);
        }
        75% {
          transform: rotate(720deg);
        }
        100% {
          transform: rotate(720deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-animation--motion .loading-animation__motion--bl,
        .loading-animation--motion .loading-animation__motion--tr,
        .loading-animation--motion .loading-animation__stage {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="app-splash"
      class="loading-animation loading-animation--fullscreen loading-animation--motion loading-animation--variant-propeller"
      role="status"
      aria-busy="true"
      aria-label="Loading logbook"
    >
      <svg
        class="loading-animation__mark loading-animation__mark--md"
        width="72"
        height="72"
        viewBox="0 0 512 512"
        overflow="visible"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
        focusable="false"
      >
        <g class="loading-animation__stage">
          <g class="loading-animation__motion loading-animation__motion--bl">
            <path d="M116 207.5H142V389.5H323V415H116Z" fill="#FFFFFF" />
          </g>
          <g class="loading-animation__motion loading-animation__motion--tr">
            <path d="M190.5 98H397V306H372V124H190.5Z" fill="#FFFFFF" />
          </g>
        </g>
      </svg>
    </div>
    {{ APP }}
  </body>
</html>
